# CASE 2 - Weed counting / infestation map. Coordinates in metres, frame aruco_map.
case: case2_weeds
title: "Case 2 - Automatic Weed Counting and Infestation Map"

area: [0.0, 0.0, 3.0, 3.0]      # plot to survey  <-- MEASURE AT THE VENUE
home: [0.0, 0.0]
altitude: 1.2                   # lower = more pixels per weed (small weeds need low altitude)
takeoff_z: 1.0
speed: 0.3
overlap: 0.35                   # line overlap
photo_spacing: 0.6              # distance between photos along a line (m)
photo_settle: 0.8               # wait (s) before each photo -> no motion blur
frame_id: aruco_map

tracker: {radius: 0.08, min_hits: 1}     # live UI counting (final count comes from the analysis)

cameras:
  rgb: {type: ros, topic: main_camera/image_raw_throttled}

detectors:                      # live detection during flight (shown in the UI)
  - type: yolo
    model: models/weeds/best.onnx        # train with train/train.py (classes e.g. weed, crop)
    conf: 0.35
  - type: exg                   # fallback if no model: every green plant
    label: plant
    min_area: 80

analysis:                       # after landing: count on all survey photos
  model: models/weeds/best.onnx # if missing -> ExG vegetation detector
  count_classes: []             # e.g. [weed] if the model has weed + crop
  merge: 0.08                   # same plant seen in 2 photos if closer than 8 cm
  cell: 0.5                     # heat-map cell 0.5 m
  tile: 0                       # 640 for very high-resolution images

safety: {min_cell_voltage: 3.5, battery_cells: 6, max_time: 540, frame: aruco_map, max_altitude: 3.0}   # geofence: auto (area + homes + 1 m)
ui: {enabled: true, port: 8090}

mock:                           # laptop test: 'weeds' = green dots on the floor
  scene:
    - {name: weed, x: 0.5, y: 0.5, r: 0.04, color: [40, 170, 40]}
    - {name: weed, x: 1.1, y: 0.7, r: 0.05, color: [30, 180, 50]}
    - {name: weed, x: 1.9, y: 1.3, r: 0.04, color: [40, 170, 40]}
    - {name: weed, x: 2.6, y: 2.2, r: 0.05, color: [35, 175, 45]}
    - {name: weed, x: 0.8, y: 2.5, r: 0.04, color: [40, 170, 40]}
    - {name: weed, x: 2.2, y: 0.4, r: 0.05, color: [30, 180, 50]}
    - {name: weed, x: 1.5, y: 2.8, r: 0.04, color: [40, 170, 40]}
