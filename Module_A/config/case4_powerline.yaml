# CASE 4 - Power line (PTL) mock-up inspection. Metres, frame aruco_map.
case: case4_powerline
title: "Case 4 - Autonomous Power Line Inspection"

supports: [[1.5, 2.0], [4.5, 2.0]]    # tower positions  <-- MEASURE THE MOCK-UP
home: [0.0, 0.0]
altitude: 1.2
takeoff_z: 1.0
speed: 0.3
frame_id: aruco_map

orbit:
  radius: 1.2                   # distance from tower centre (keep >= 1 m for safety!)
  support_radius: 0.15          # tower half-width (for distance to the surface)
  heights: [0.8, 1.5]           # orbit levels
  points: 8                     # stops per circle
  dwell: 0.8                    # seconds at each stop
  start_deg: -90                # (full_circle / single support only) start on the -y side
  speed: 0.3
  wire_margin_deg: 25           # arcs stop this far (deg) before the wire directions -> never cross the wires
  # full_circle: true           # old behaviour: full circles CROSS the wires - only if they are clear of `heights`
span:
  enabled: true
  side: auto                    # auto = the side of the home pad | left | right (of support 1 -> last support)
  offset: 1.0                   # fly parallel to the wires at 1 m side distance
  height: 1.5
  step: 0.5
  dwell: 0.5

defect_hover: 1.5
class_alias: {hotspot: overheating}
tracker: {mode: rays, radius: 0.25, min_hits: 4, default_range: 1.0}   # 3D triangulation from several views
save_frames_every: 0.7          # collect training images of the mock-up

cameras:
  rgb:                          # inspection camera. If the TECHNIC camera faces DOWN, mount/tilt a camera forward
    type: ros
    topic: main_camera/image_raw_throttled
    orientation: forward        # forward | down
  thermal:                      # TR256i thermal module mounted LOOKING FORWARD (heating tape = overheated wire/contact)
    type: cv
    device: 1                   # check with: python3 tools/thermal_probe.py
    thermal: auto
    hfov_deg: 56
    orientation: forward

detectors:
  - type: thermal               # overheating: anything above 45 C on the structure (NO training needed)
    image: thermal_temp
    mode: celsius
    threshold_c: 45
    min_area: 4
    label: overheating
  - type: thermal               # brightness fallback if the camera gives only a picture
    image: thermal
    mode: percentile
    percentile: 99.7
    min_delta: 50
    min_area: 4
    label: overheating
  - type: yolo
    model: models/powerline/best.onnx    # e.g. insulator_damage, support_deformation, wire_sag, bird_nest
    conf: 0.40
  - type: hsv                   # fallback: red markers used as 'damaged' parts on mock-ups - TUNE!
    label: overheating
    min_area: 120
    ranges: [[[0, 150, 150], [10, 255, 255]], [[170, 150, 150], [179, 255, 255]]]

safety: {min_cell_voltage: 3.5, battery_cells: 6, max_time: 540, frame: aruco_map, max_altitude: 3.0}   # geofence: auto (towers + orbit + 1 m)
ui: {enabled: true, port: 8090}

mock:                           # laptop test: grey towers, 1 heated clamp on tower 1 (thermal only), 1 red marker mid-span
  scene:
    - {name: tower, x: 1.5, y: 2.0, z: 1.0, r: 0.15, color: [120, 120, 120]}
    - {name: heating_tape, x: 1.5, y: 1.85, z: 1.5, r: 0.05, temp: 75, rgb_visible: false}
    - {name: tower, x: 4.5, y: 2.0, z: 1.0, r: 0.15, color: [120, 120, 120]}
    - {name: overheating, x: 3.0, y: 2.0, z: 1.55, r: 0.04, color: [10, 10, 220]}
