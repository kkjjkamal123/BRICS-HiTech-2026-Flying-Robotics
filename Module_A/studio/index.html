<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>BRICS Mission Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f1720;--panel:#17212b;--panel2:#1f2b38;--txt:#e6edf3;--mut:#8b9bab;--acc:#2a9d8f;--acc2:#e9c46a;--red:#e63946;--blue:#457b9d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:#1d3557;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0}header .proj{color:#cfe3f5;font-size:14px;flex:1}
button{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer}
button:hover{filter:brightness(1.15)}button.g{background:var(--acc)}button.y{background:var(--acc2);color:#000}button.r{background:var(--red)}
button.big{font-size:17px;padding:12px 22px;font-weight:bold}button.ghost{background:transparent;border:1px solid #456;color:var(--txt)}
button:disabled{opacity:.4;cursor:default}
.wrap{display:flex;min-height:calc(100vh - 56px)}
nav{width:230px;background:var(--panel);padding:12px 0;flex-shrink:0}
nav a{display:flex;gap:10px;align-items:center;padding:11px 18px;color:var(--mut);text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a.on{color:#fff;background:var(--panel2);border-left-color:var(--acc)}nav a .n{background:#2c3e50;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
nav a.done .n{background:var(--acc);color:#fff}
main{flex:1;padding:18px 24px 280px;max-width:1150px}
h2{margin:4px 0 4px;font-size:22px}.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--panel);border-radius:10px;padding:16px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ps{background:var(--panel2);border-radius:10px;padding:14px;cursor:pointer;border:2px solid transparent}
.ps:hover{border-color:#456}.ps.sel{border-color:var(--acc)}.ps h3{margin:0 0 6px;font-size:16px}.ps p{color:var(--mut);margin:0;font-size:13px}
.tag{display:inline-block;background:#2c3e50;border-radius:4px;padding:2px 7px;font-size:11px;margin:6px 4px 0 0;color:#cde}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 3px}
input,select,textarea{width:100%;background:#0b1118;color:var(--txt);border:1px solid #2d3d4d;border-radius:6px;padding:8px;font-size:14px}
textarea{font-family:Menlo,monospace;font-size:12.5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:140px}
.pathrow{display:flex;gap:6px}.pathrow input{flex:1}
.hint{color:var(--mut);font-size:12.5px;margin-top:6px}
.ok{color:#52d18a}.bad{color:#ff7b7b}
table{border-collapse:collapse;width:100%;margin:6px 0}td,th{border-bottom:1px solid #2d3d4d;padding:5px 7px;text-align:left;font-size:13px}th{color:var(--mut)}
.md table{background:#0b1118}.md h1{font-size:18px}.md h2{font-size:16px}
#console{position:fixed;bottom:0;left:230px;right:0;height:250px;background:#05090d;border-top:2px solid #234;display:flex;flex-direction:column;z-index:4}
#console .bar{display:flex;gap:8px;align-items:center;padding:5px 10px;background:#0d151d;font-size:13px}
#console .bar select{width:auto;padding:3px}
#log{flex:1;overflow:auto;font-family:Menlo,monospace;font-size:11.5px;padding:6px 10px;white-space:pre-wrap;color:#b9d4ea}
.pill{padding:2px 8px;border-radius:10px;font-size:12px}.pill.running{background:#e9c46a;color:#000}.pill.done{background:#2a9d8f}.pill.failed{background:#e63946}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
#modal .box{background:var(--panel);border-radius:10px;width:720px;max-height:80vh;display:flex;flex-direction:column;padding:14px}
#fl{overflow:auto;flex:1;margin:8px 0}#fl div{padding:5px 8px;cursor:pointer;border-radius:4px}#fl div:hover{background:var(--panel2)}
.steps li{margin:4px 0}.steps li.cur{color:var(--acc2);font-weight:bold}.steps li.fin{color:#52d18a}
.files a{display:inline-block;margin:4px 6px 4px 0;padding:6px 10px;background:var(--panel2);border-radius:6px;color:#cfe3f5;text-decoration:none;font-size:13px}
.big-num{font-size:26px;font-weight:bold}
.hidden{display:none}
</style></head>
<body>
<header><h1>🚁 BRICS Mission Studio</h1><div class="proj" id="hproj">No problem statement selected</div>
<button class="y big" onclick="go('auto')">⚡ AUTOPILOT</button></header>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="console"><div class="bar"><b>Jobs</b><select id="jobsel" onchange="showJob(this.value)"></select><span id="jstat"></span>
<span style="flex:1"></span><button class="ghost" onclick="stopJob()">Stop job</button><button class="ghost" onclick="toggleConsole()">▾</button></div><div id="log">Ready. Every action runs here with a live log.</div></div>
<div id="modal"><div class="box"><b id="mpath"></b><div id="fl"></div>
<div class="row"><button class="ghost" onclick="closeModal()">Cancel</button><button class="g" onclick="pickCurrent()">Use this folder</button></div></div></div>

<script>
const STEPS=[["ps","Problem statement"],["data","Data & AI model"],["mission","Mission setup"],["test","Simulation test"],["econ","Economics"],["docs","Documents"],["drone","Drone & flight"],["auto","AUTOPILOT"],["help","Help / self-test"]];
let S={},cur="ps",curJob=null,pickCb=null,pickPath="";
const $=s=>document.querySelector(s);
async function api(p,b){const r=await fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});return r.json()}
async function load(){S=await api("/api/state");$("#hproj").textContent=S.project?("Project: "+S.project.title):"No problem statement selected - start at step 1";nav();}
function nav(){$("#nav").innerHTML=STEPS.map((s,i)=>`<a class="${s[0]==cur?'on':''}" onclick="go('${s[0]}')"><span class="n">${i+1}</span>${s[1]}</a>`).join("")}
async function go(k){cur=k;await load();render[k]();window.scrollTo(0,0)}
function need(){if(!S.project){$("#main").innerHTML=`<div class="card"><h2>Choose a problem statement first</h2><button class="g" onclick="go('ps')">Go to step 1</button></div>`;return false}return true}
async function run(action,args,after){const r=await api("/api/run",Object.assign({action},args||{}));curJob=r.job;await refreshJobs();showJob(r.job);if(after)waitJob(r.job,after);return r.job}
function waitJob(id,cb){const t=setInterval(async()=>{const j=await api("/api/job/"+id);if(j.status!="running"){clearInterval(t);cb(j)}},1200)}
function esc(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function fileLink(p,label){return `<a href="/file?path=${encodeURIComponent(p)}" target="_blank">${esc(label||p.split('/').pop())}</a>`}
function pathInput(id,val,ph){return `<div class="pathrow"><input id="${id}" value="${esc(val||'')}" placeholder="${ph||'folder or .zip path'}"><button class="ghost" onclick="browse('${id}')">Browse…</button></div>`}

const render={
ps(){
 const cs=Object.entries(S.cases).map(([k,c])=>`<div class="ps ${S.project&&S.project.case==k?'sel':''}" onclick="newProj('${k}')"><h3>${esc(c.title)}</h3><p>${esc(c.problem.slice(0,150))}…</p>
 <span class="tag">${esc(c.partner)}</span><span class="tag">${c.mission_type}</span>${c.classes.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`).join("");
 const pr=(S.projects||[]).map(p=>`<tr><td>${esc(p.title)}</td><td>${p.case}</td><td>${p.model?esc(p.model):'-'}</td><td><button class="ghost" onclick="openProj('${p.slug}')">Open</button></td></tr>`).join("");
 $("#main").innerHTML=`<h2>1 · Select the problem statement</h2><p class="sub">Click a known case, or describe a NEW problem statement - the studio builds the solution for it.</p>
 <div class="cards">${cs}</div>
 <div class="card" style="margin-top:16px"><h3>➕ New / unknown problem statement</h3>
 <div class="row"><div><label>Title</label><input id="c_title" placeholder="e.g. Autonomous search for lost people"></div><div><label>Partner</label><input id="c_partner"></div></div>
 <label>Problem (from the task description)</label><textarea id="c_problem" rows="3"></textarea>
 <div class="row"><div><label>Customer</label><input id="c_customer"></div><div><label>Objects to detect (comma separated)</label><input id="c_objects" placeholder="person, backpack"></div>
 <div><label>Mission type</label><select id="c_mt"><option value="survey">survey - search an area (camera down)</option><option value="photos">photos - grid photos + counting/map</option><option value="orbit">orbit - inspect structures (camera forward)</option><option value="waypoints">waypoints - fly a route / patrol</option></select></div></div>
 <p><button class="g" onclick="newCustom()">Create solution for this PS</button></p></div>
 ${pr?`<div class="card"><h3>Existing projects</h3><table><tr><th>Project</th><th>Case</th><th>Model</th><th></th></tr>${pr}</table></div>`:''}`;
},
data(){ if(!need())return; const p=S.project;
 const models=(S.models||[]).map(m=>`<tr><td><b>${esc(m.name)}</b>${m.rknn?' <span class="tag">RKNN</span>':''}</td><td class="md">${m.metrics||'-'}</td><td>${m.onnx?`<button class="g" onclick="useModel('${m.onnx}')">Use in mission</button>`:''}</td></tr>`).join("");
 $("#main").innerHTML=`<h2>2 · Data & AI model</h2><p class="sub">Give ANY dataset (zip or folder - YOLO / COCO / VOC / CSV / class folders). The studio converts, trains, validates and exports. Current model: <b>${esc(p.model||'none')}</b></p>
 <div class="card"><h3>A. Dataset → trained model</h3><label>Dataset (zip or folder)</label>${pathInput("ds",p.dataset)}
 <div class="row"><div><label>Quality</label><select id="q"><option value="fast">fast (minutes - check it works)</option><option value="balanced" selected>balanced</option><option value="best">best (bigger model, longer)</option></select></div>
 <div><label>Max hours (optional)</label><input id="hours" type="number" step="0.25" placeholder="e.g. 1.5"></div>
 <div><label>Image size</label><select id="imgsz"><option value="">auto (640)</option><option>416</option><option>640</option><option>960</option></select></div>
 <div><label>Architecture</label><select id="arch"><option value="yolo11">YOLO11 (compatible)</option><option value="yolo26">YOLO26 (newest)</option></select></div></div>
 <label><input type="checkbox" id="aerial" style="width:auto"> top-down drone images (aerial augmentation)</label>
 <p><button class="g" onclick="run('prepare',{inputs:[$('#ds').value]},j=>{if(j.result.report)alert(j.result.report)})">1. Check / convert dataset</button>
 <button class="g big" onclick="train()">2. Train best model</button></p><div class="hint">Training uses the Mac GPU (MPS). The model is automatically put into the mission config when finished. Results: precision / recall / mAP.</div></div>
 <div class="card"><h3>Trained models</h3><table><tr><th>Model</th><th>Validation</th><th></th></tr>${models||'<tr><td colspan=3>none yet</td></tr>'}</table></div>
 <div class="card"><h3>B. Only images (no labels)?</h3><label>Image folder</label>${pathInput("lf","")}
 <div class="row"><div><label>Auto-label method</label><select id="alm"><option value="hsv">colour (flames / markers)</option><option value="exg">vegetation (plants)</option><option value="thermal">thermal hot spots</option><option value="model">existing model</option></select></div>
 <div><label>Class name / model path</label><input id="all" placeholder="fire   or   models/x/best.pt"></div></div>
 <p><button onclick="autolabel()">Auto-label</button> <button onclick="api('/api/terminal',{what:'label',folder:$('#lf').value,classes:(S.case.classes||[])})">Open labelling tool (draw / fix boxes)</button>
 <button class="g" onclick="$('#ds').value=$('#lf').value;train()">Train on this folder</button></p>
 <div class="hint">Labelling tool keys: 1-9 class · drag = box · right-click delete · d next · a back · u undo · q quit.</div></div>
 <div class="card"><h3>C. Videos → images</h3><div class="row"><div><label>Video file or frames folder</label>${pathInput("vid","")}</div><div><label>Output folder</label><input id="vout" value="${S.root}/datasets/${p.slug}_frames"></div></div>
 <p><button onclick="run('extract',{inputs:[$('#vid').value],out:$('#vout').value})">Extract sharp, non-duplicate frames</button></p></div>
 <div class="card"><h3>D. Few labelled images → 1000 synthetic (copy-paste)</h3><div class="row"><div><label>Labelled dataset (objects)</label>${pathInput("so",p.dataset?S.root+'/'+p.dataset:'')}</div><div><label>Background photos (venue floor, no objects)</label>${pathInput("sb","")}</div></div>
 <p><button onclick="run('synth',{objects:$('#so').value,backgrounds:$('#sb').value,out:'${S.root}/datasets/${p.slug}_synth',n:1000},()=>{$('#ds').value='${S.root}/datasets/${p.slug}_synth'})">Generate 1000 images</button></p></div>`;
},
async mission(){ if(!need())return; const c=await api("/api/config"); const p=S.project; const y=c.yaml, g=c.cfg||{};
 $("#main").innerHTML=`<h2>3 · Mission setup</h2><p class="sub">${esc(S.case.solution)}</p>
 <div class="card"><h3>Quick settings</h3><div class="row">
 ${g.area?`<div><label>Area x0,y0,x1,y1 (m, aruco_map)</label><input id="f_area" value="${g.area.join(',')}"></div>`:''}
 ${g.supports?`<div><label>Tower positions x,y; x,y …</label><input id="f_sup" value="${g.supports.map(s=>s.join(',')).join('; ')}"></div>`:''}
 ${g.targets?`<div><label>Targets x,y; x,y …</label><input id="f_tgt" value="${g.targets.map(s=>s.join(',')).join('; ')}"></div>`:''}
 <div><label>Altitude (m)</label><input id="f_alt" type="number" step="0.1" value="${g.altitude??1.5}"></div>
 <div><label>Speed (m/s)</label><input id="f_speed" type="number" step="0.05" value="${g.speed??0.4}"></div>
 <div><label>Max mission time (s)</label><input id="f_time" type="number" value="${(g.safety||{}).max_time??540}"></div></div>
 <p><button class="g" onclick="saveQuick()">Save quick settings</button> <span class="hint">Mission script: ${esc(S.case.script)}</span></p></div>
 <div class="card"><h3>Full configuration (YAML) - everything is editable</h3><div class="hint">${esc(c.path)} · detectors, cameras, inspection, tracker, safety, swarm, mock scene…</div>
 <textarea id="yaml" rows="26">${esc(y)}</textarea><p><button class="g" onclick="saveYaml()">Save YAML</button> <button onclick="go('test')">Next: test →</button></p></div>`;
},
test(){ if(!need())return;
 $("#main").innerHTML=`<h2>4 · Simulation test</h2><p class="sub">Runs the real mission code with a simulated drone and camera (no hardware). Checks plan, detection pipeline, safety logic and report.</p>
 <div class="card"><button class="g big" onclick="mock()">▶ Run simulated mission</button> <span class="hint">Watch it live: <a href="http://localhost:8080" target="_blank">operator UI :8080</a>${S.project.case=='case3'?' · <a href="http://localhost:8000" target="_blank">swarm dashboard :8000</a>':''}</span>
 <div id="mres" style="margin-top:12px"></div></div>
 <div class="card"><h3>Test a model on images / video</h3><p class="hint">Use the "Help / self-test" page, or in Terminal: <code>python train/predict.py --model ${esc(S.project.model||'models/x/best.onnx')} --source FOLDER --show</code></p></div>`;
},
async econ(){ if(!need())return; const e=await api("/api/econ");
 $("#main").innerHTML=`<h2>5 · Economic efficiency (Module C)</h2><p class="sub">Edit the numbers (customer, CAPEX, OPEX, benefits, rate) → Calculate. Produces payback, ROI, NPV, IRR, sensitivity, break-even + Excel with live formulas.</p>
 <div class="card"><textarea id="eyaml" rows="24">${esc(e.yaml)}</textarea><p><button class="g big" onclick="econ()">Save & calculate</button></p></div><div class="card md" id="eres"></div>`;
},
async docs(){ if(!need())return; const d=await api("/api/deliverables");
 const fl=d.files.map(f=>fileLink(`deliverables/${S.project.slug}/${f}`,f)).join("");
 $("#main").innerHTML=`<h2>6 · Documents & presentation</h2><p class="sub">Generates every deliverable: technical description + block diagram, roles, components, test programme, test report (from your latest run + model metrics), economics, operating instructions, Q&A, presentation (PPTX + PDF) and a ready GitHub repository.</p>
 <div class="card"><button class="g big" onclick="run('docs',{},()=>go('docs'))">Generate all documents</button> <button class="ghost" onclick="api('/api/open',{path:'deliverables/${S.project.slug}'})">Open folder in Finder</button></div>
 <div class="card files"><h3>Files</h3>${fl||'<i>not generated yet</i>'}</div>
 <div class="card md" id="dprev"></div>`;
 if(d.files.includes("01_Technical_Description.md")){const h=await api("/api/md?path="+encodeURIComponent(`deliverables/${S.project.slug}/05_Test_Report.md`));$("#dprev").innerHTML=h.html.replace(/src="(?!http)([^"]+)"/g,`src="/file?path=deliverables/${S.project.slug}/$1"`)}
},
drone(){ if(!need())return; const p=S.project;
 $("#main").innerHTML=`<h2>7 · Drone & flight</h2><p class="sub">Connect the laptop to the drone Wi-Fi <b>technic-xxxx</b> (Wi-Fi password: see the SKYRIS documentation). Terminal windows open for steps that need the drone password.</p>
 <div class="card"><div class="row"><div><label>Drone IP</label><input id="ip" value="10.42.0.1"></div>${p.case=='case3'?'<div><label>Drone id (0..n-1)</label><input id="did" value="0"></div>':''}</div></div>
 <div class="card"><h3>1. Faster AI on the NPU (optional)</h3><p><button onclick="run('rknn',{use:true})">Convert model to RKNN + use it</button> <button class="ghost" onclick="api('/api/terminal',{what:'colima'})">Start Docker (colima)</button></p>
 <div class="hint">If RKNN gives problems on the drone, choose the .onnx model again on page 2 (CPU, always works).</div></div>
 <div class="card"><h3>2. Copy code + models to the drone</h3><button class="g" onclick="term('deploy')">Deploy to drone</button></div>
 <div class="card"><h3>3. Fly</h3>${p.case=='case3'?'<p><button onclick="run(\'planner\',{})">Start swarm planner on this laptop</button> <a href="http://localhost:8000" target="_blank">dashboard</a> · set planner_url in the YAML to this laptop\'s IP</p>':''}
 <button class="g big" onclick="term('run_drone')">▶ Start mission on drone</button> <a id="dui" href="#" target="_blank" onclick="this.href='http://'+$('#ip').value+':8080'">Open operator UI (START / LAND / ABORT)</a>
 <div class="hint">Safety: RC kill switch in hand, markers visible, battery charged. Mission refuses to start if pre-flight checks fail.</div></div>
 <div class="card"><h3>4. After the flight</h3><button onclick="term('fetch_runs')">Copy flight results to laptop</button> then regenerate documents (step 6) - the test report uses the real flight.
 <p><button class="ghost" onclick="term('ssh')">Open SSH terminal</button></p></div>`;
},
auto(){ if(!need())return; const p=S.project;
 $("#main").innerHTML=`<h2>⚡ AUTOPILOT - full solution in one click</h2><p class="sub">For <b>${esc(p.title)}</b>: ${p.case=='custom'?'custom PS':'known case'} → (dataset → train → export) → simulation test → economics → all documents + presentation + GitHub repo.</p>
 <div class="card"><label>Dataset (optional - leave empty to use no-training detectors / existing model)</label>${pathInput("ads",p.dataset)}
 <div class="row"><div><label>Quality</label><select id="aq"><option value="fast">fast</option><option value="balanced" selected>balanced</option><option value="best">best</option></select></div>
 <div><label>Max training hours</label><input id="ah" type="number" step="0.25" placeholder="no limit"></div>
 <div><label>Architecture</label><select id="aarch"><option value="yolo11">YOLO11</option><option value="yolo26">YOLO26</option></select></div></div>
 <label><input type="checkbox" id="aaer" style="width:auto"> top-down images</label> <label><input type="checkbox" id="arknn" style="width:auto"> also convert to RKNN (needs Docker running)</label>
 <p><button class="y big" onclick="autopilot()">⚡ RUN AUTOPILOT</button></p></div>
 <div class="card"><h3>Progress</h3><ol class="steps" id="asteps"><li>waiting</li></ol><div id="ares"></div></div>`;
},
help(){
 $("#main").innerHTML=`<h2>Help & self-test</h2>
 <div class="card"><button class="g" onclick="run('selftest',{})">Run full self-test (≈35 s)</button> <span class="hint">Should end with "15 passed, 0 failed".</span></div>
 <div class="card"><h3>Typical flow at the venue</h3><ol>
 <li><b>Step 1</b>: click the case they gave you (or describe a new PS).</li>
 <li><b>Step 2</b>: point to their dataset → Train. No dataset? Fly once with the mission (frames are saved), extract frames, auto-label, fix with the labelling tool, train.</li>
 <li><b>Step 3</b>: measure the field → enter area / targets / altitude. Tune colour ranges if you use colour detectors.</li>
 <li><b>Step 4</b>: simulation test → read the report.</li><li><b>Step 5</b>: economics numbers → calculate.</li>
 <li><b>Step 6</b>: generate documents + presentation. <b>Step 7</b>: deploy and fly; copy results back; regenerate documents.</li></ol>
 <p>Or press <b>⚡ AUTOPILOT</b> after step 1 (and 3).</p></div>
 <div class="card"><h3>Manual & docs (offline)</h3><div class="files">${fileLink('README.md','Toolkit manual (README.md)')}<a href="/file?path=offline/docs/docs.skyris.ru/technic6S/index.html" target="_blank">TECHNIC 6S documentation</a></div></div>`;
}};

async function newProj(k){await api("/api/project/new",{case:k});await load();go('data')}
async function newCustom(){const t=$("#c_title").value.trim();if(!t){alert("Give a title");return}
 await api("/api/project/new",{case:"custom",custom:{title:t,partner:$("#c_partner").value,problem:$("#c_problem").value,customer:$("#c_customer").value,objects:$("#c_objects").value,mission_type:$("#c_mt").value}});await load();go('data')}
async function openProj(s){await api("/api/project/open",{slug:s});go('data')}
async function useModel(p){await api("/api/model/use",{path:p});alert("Model set in the mission config");go('data')}
function train(){run('train',{data:$('#ds').value,quality:$('#q').value,hours:$('#hours').value,imgsz:$('#imgsz').value,arch:$('#arch').value,aerial:$('#aerial').checked},()=>go('data'))}
function autolabel(){const m=$('#alm').value;run('autolabel',{folder:$('#lf').value,method:m,label:$('#all').value,model:$('#all').value})}
async function saveYaml(){const r=await api("/api/config",{yaml:$("#yaml").value});alert(r.ok?"Saved":r.error)}
async function saveQuick(){const b={};if($("#f_area"))b.area=$("#f_area").value.split(",").map(Number);const pts=v=>v.split(";").map(t=>t.split(",").map(Number));
 if($("#f_sup"))b.supports=pts($("#f_sup").value);if($("#f_tgt"))b.targets=pts($("#f_tgt").value);b.altitude=+$("#f_alt").value;b.speed=+$("#f_speed").value;b["safety.max_time"]=+$("#f_time").value;
 await api("/api/config/form",b);go('mission')}

 ${s.result?`<table><tr><td>Result</td><td>${esc(s.result)}</td></tr><tr><td>Flight time (sim)</td><td>${s.duration_s} s</td></tr><tr><td>Distance</td><td>${s.distance_m} m</td></tr><tr><td>Objects</td><td>${esc(JSON.stringify(s.counts))}</td></tr></table>`:''}
 ${j.result.report?fileLink(j.result.report,'📄 Open mission report'):''}`})}

 run('econ',{},async j=>{if(j.result.md){const h=await fetch("/api/md?path="+encodeURIComponent("economics/generated/out/"+S.project.slug+".md")).then(r=>r.json());$("#eres").innerHTML=h.html+`<p>${fileLink("economics/generated/out/"+S.project.slug+".xlsx","Download Excel (live formulas)")}</p>`}})}

 $("#ares").innerHTML=`<p class="${j.status=='done'?'ok':'bad'}"><b>${j.status=='done'?'✅ Solution complete':'❌ Stopped - see log'}</b></p><button class="g" onclick="go('docs')">Open documents</button>`});
 const t=setInterval(async()=>{if(!curJob)return;const j=await api("/api/job/"+curJob);const st=j.result.steps||[];const k=j.result.step??0;

async function refreshJobs(){const js=await api("/api/jobs");if(!curJob&&js.length)curJob=js[0].id;$("#jobsel").innerHTML=js.map(j=>`<option value="${j.id}" ${j.id==curJob?'selected':''}>${esc(j.title)} - ${j.status} (${j.elapsed}s)</option>`).join("")}

async function tickConsole(){if(curJob){const j=await api("/api/job/"+curJob);const l=$("#log");const atBottom=l.scrollTop+l.clientHeight>=l.scrollHeight-30;
 l.textContent=j.log.join("\n");if(atBottom)l.scrollTop=l.scrollHeight;$("#jstat").innerHTML=`<span class="pill ${j.status}">${j.status}</span> ${j.elapsed}s`;
 if(j.status!="running")refreshJobs()}}

 $("#fl").innerHTML=`<div onclick="ls('${r.parent.replace(/'/g,"\\'")}')">⬆ ..</div>`+r.items.map(i=>`<div onclick="${i.dir?`ls('${i.path.replace(/'/g,"\\'")}')`:`pick('${i.path.replace(/'/g,"\\'")}')`}">${i.dir?'📁':'📄'} ${esc(i.name)}</div>`).join("")}
