name: BRICSDashboard
options:
  bundleIdPrefix: org.cit.brics
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEVELOPMENT_TEAM: ""
targets:
  BRICSDashboard:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: "BRICS Dashboard"
        PRODUCT_BUNDLE_IDENTIFIER: org.cit.brics.dashboard
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
